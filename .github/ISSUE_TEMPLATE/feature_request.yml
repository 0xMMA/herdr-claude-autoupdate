name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is annoying or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do? Please check docs/requirements.md first; a change that conflicts with a requirement needs a reason.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
