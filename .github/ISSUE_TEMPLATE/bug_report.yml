name: Bug report
description: Something did not restart, restarted when it should not have, or lost state.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove anything private (paths, project names, prompt text)
        from logs before pasting them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what the plugin did instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of the status action
      description: Run "Claude auto-update: status" (or `node bin/claude-autoupdate.mjs status` in the plugin directory) and paste the redacted output.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`herdr --version`, `claude --version`, `node --version`, plugin version"
      placeholder: herdr 0.9.3, Claude Code 2.1.290, Node 24.14.0, plugin 0.1.0
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell in the affected pane
      placeholder: pwsh, bash, zsh, fish, ...
